version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-liberation_os}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: .
      args:
        APP: worker
    restart: "no"
    profiles: ["migrate"]
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgres@postgres:5432/liberation_os?schema=public}
    depends_on:
      postgres:
        condition: service_healthy
    command: ["pnpm", "db:push"]

  web:
    build:
      context: .
      args:
        APP: web
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgres@postgres:5432/liberation_os?schema=public}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4.1-mini}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LOCAL_LLM_MODEL: ${LOCAL_LLM_MODEL:-}
      LOCAL_LLM_API_KEY: ${LOCAL_LLM_API_KEY:-}
      AUTH_SECRET: ${AUTH_SECRET:-change-me}
      WORKFLOW_JOB_ATTEMPTS: ${WORKFLOW_JOB_ATTEMPTS:-3}
      WORKFLOW_JOB_BACKOFF_MS: ${WORKFLOW_JOB_BACKOFF_MS:-5000}
      WORKFLOW_REMOVE_ON_COMPLETE: ${WORKFLOW_REMOVE_ON_COMPLETE:-100}
      WORKFLOW_REMOVE_ON_FAIL: ${WORKFLOW_REMOVE_ON_FAIL:-100}
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/api/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  worker:
    build:
      context: .
      args:
        APP: worker
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgres@postgres:5432/liberation_os?schema=public}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4.1-mini}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LOCAL_LLM_MODEL: ${LOCAL_LLM_MODEL:-}
      LOCAL_LLM_API_KEY: ${LOCAL_LLM_API_KEY:-}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-2}
      WORKFLOW_JOB_ATTEMPTS: ${WORKFLOW_JOB_ATTEMPTS:-3}
      WORKFLOW_JOB_BACKOFF_MS: ${WORKFLOW_JOB_BACKOFF_MS:-5000}
      WORKFLOW_REMOVE_ON_COMPLETE: ${WORKFLOW_REMOVE_ON_COMPLETE:-100}
      WORKFLOW_REMOVE_ON_FAIL: ${WORKFLOW_REMOVE_ON_FAIL:-100}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"const net=require('net'); const u=new URL(process.env.REDIS_URL); const s=net.createConnection({host:u.hostname,port:Number(u.port||6379)},()=>{s.end();process.exit(0)}); s.on('error',()=>process.exit(1)); setTimeout(()=>process.exit(1),1500);\""]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s

volumes:
  pgdata:
  redisdata:
